<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>带拍 · v5 方案卡片</title>
<style>
  :root {
    --bg:#0a0a0a; --card:#141414; --text:#e8e8e8;
    --dim:#8a8a8a; --dimmer:#5a5a5a;
    --green:#4ade80; --gold:#f59e0b; --purple:#a78bfa; --cyan:#22d3ee;
    --pink:#f472b6; --border:#262626; --radius:14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif;
    background:var(--bg);color:var(--text);min-height:100dvh;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:480px;margin:0 auto;padding:0 0 40px}

  .header{text-align:center;padding:24px 16px 8px}
  .header h1{font-size:18px;font-weight:700;letter-spacing:-0.3px;background:linear-gradient(135deg,#f59e0b,#fbbf24);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .header .tag{font-size:12px;color:var(--dim);margin-top:4px}

  /* Carousel */
  .carousel{margin:10px 0}
  .carousel-track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;border-radius:var(--radius);background:#000}
  .carousel-track::-webkit-scrollbar{display:none}
  .slide{flex:0 0 100%;scroll-snap-align:start}
  .slide img{width:100%;display:block}
  .dots{display:flex;justify-content:center;gap:6px;padding:10px 0}
  .dot{width:6px;height:6px;border-radius:3px;background:var(--border);transition:all .3s}
  .dot.active{background:var(--gold);width:20px}

  /* Meta */
  .meta-row{margin:0 14px 6px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .meta-badge{padding:4px 10px;border-radius:7px;font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
  .meta-badge.shot{background:rgba(245,158,11,.10);color:var(--gold)}
  .meta-badge.angle{background:rgba(167,139,250,.10);color:var(--purple)}
  .meta-badge.dir{background:rgba(34,211,238,.08);color:var(--cyan)}

  /* Card row base */
  .crd{margin:0 14px 5px;padding:12px 14px;border-radius:var(--radius);display:flex;align-items:flex-start;gap:10px}
  .crd .ic{font-size:19px;flex-shrink:0;line-height:1.5}
  .crd .bd{flex:1;min-width:0}
  .crd .lb{font-size:10px;color:var(--dimmer);letter-spacing:.5px;margin-bottom:5px;text-transform:uppercase}
  .tags{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
  .tg{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;border-radius:7px;font-size:12px;font-weight:600;white-space:nowrap}
  .tg.mv{background:rgba(34,211,238,.10);color:var(--cyan)}
  .tg.ht{background:rgba(167,139,250,.10);color:var(--purple)}
  .tg.gr{background:rgba(138,138,138,.10);color:var(--dim)}
  .tg.ps{background:rgba(74,222,128,.08);color:var(--green)}

  .crd.shooter{background:var(--card);border:1px solid var(--border)}
  .crd.subject{background:rgba(74,222,128,.03);border:1px solid rgba(74,222,128,.08)}
  .sub-desc{font-size:12px;color:var(--dim);margin-top:5px;line-height:1.5}

  /* Detail (collapsible) — now right after subject */
  .det-wrap{margin:0 14px 5px;border-radius:var(--radius);overflow:hidden}
  .det-head{padding:11px 14px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);font-size:12px;color:var(--dim);display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none}
  .det-head .ar{transition:transform .2s;font-size:10px}
  .det-wrap.open .det-head .ar{transform:rotate(180deg)}
  .det-wrap.open .det-head{border-radius:var(--radius) var(--radius) 0 0}
  .det-body{max-height:0;overflow:hidden;transition:max-height .3s;background:var(--card);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--radius) var(--radius)}
  .det-wrap.open .det-body{max-height:500px}
  .det-row{padding:10px 14px;font-size:12px;line-height:1.7;color:var(--dim);display:flex;gap:8px}
  .det-row+.det-row{border-top:1px solid rgba(255,255,255,.03)}

  .crd.vibe{background:rgba(245,158,11,.03);border:1px solid rgba(245,158,11,.08)}
  .vibe-text{font-size:13px;color:var(--gold);line-height:1.6}

  /* Post & AI */
  .crd.post{background:rgba(244,114,182,.03);border:1px solid rgba(244,114,182,.08)}
  .post-grid{display:flex;flex-direction:column;gap:6px}
  .post-item{display:flex;align-items:flex-start;gap:6px;font-size:12px;line-height:1.5}
  .p-cat{flex-shrink:0;padding:2px 7px;border-radius:5px;font-size:10px;font-weight:600;white-space:nowrap}
  .p-cat.color{background:rgba(245,158,11,.12);color:var(--gold)}
  .p-cat.ai{background:rgba(167,139,250,.12);color:var(--purple)}
  .p-cat.add{background:rgba(74,222,128,.10);color:var(--green)}
  .p-text{color:var(--dim);padding-top:1px}

  /* Image Gen Prompt — Chinese template */
  .crd.gen{background:var(--card);border:1px solid rgba(34,211,238,.15)}
  .prompt-box{background:rgba(0,0,0,.3);border-radius:10px;padding:12px;font-size:12px;color:var(--dim);line-height:1.8;max-height:140px;overflow-y:auto;margin-bottom:10px}
  .prompt-actions{display:flex;gap:8px}
  .btn{padding:8px 16px;border-radius:9px;border:none;font-size:12px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
  .btn:active{transform:scale(.96)}
  .btn-copy{background:rgba(138,138,138,.15);color:var(--dim)}
  .btn-gen{background:rgba(34,211,238,.08);color:var(--cyan);opacity:.7}

  .toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.9);color:#fff;padding:10px 22px;border-radius:20px;font-size:13px;font-weight:600;opacity:0;transition:opacity .25s;pointer-events:none;z-index:100}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>带拍 · v5 完整方案</h1>
    <div class="tag">效果预期 → 怎么拍 → 动作 → 构图 → 后期AI → 生图</div>
  </div>

  <!-- Carousel -->
  <div class="carousel">
    <div class="carousel-track" id="track"></div>
    <div class="dots" id="dotsEl"></div>
  </div>

  <!-- Meta -->
  <div class="meta-row" id="metaRow"></div>

  <!-- 1. 效果预期 — 紧贴照片，先感受再行动 -->
  <div class="crd vibe"><div class="ic">✨</div><div class="bd"><div class="lb">效果预期</div><div class="vibe-text" id="vibeText"></div></div></div>

  <!-- 2. 你怎么拍 -->
  <div class="crd shooter"><div class="ic">📍</div><div class="bd"><div class="lb">你怎么拍</div><div class="tags" id="shooterTags"></div></div></div>

  <!-- 3. 被摄者动作 -->
  <div class="crd subject"><div class="ic">🧍</div><div class="bd"><div class="lb">被摄者动作</div><div class="tags" id="subjectTags"></div><div class="sub-desc" id="subjectDesc"></div></div></div>

  <!-- 4. 构图详解 (collapsible) -->
  <div class="det-wrap" id="detWrap">
    <div class="det-head" onclick="this.parentElement.classList.toggle('open')"><span>📐 构图详解</span><span class="ar">▼</span></div>
    <div class="det-body" id="detBody"></div>
  </div>

  <!-- 5. 后期 & AI 增强 -->
  <div class="crd post"><div class="ic">🎨</div><div class="bd"><div class="lb">后期 & AI 增强</div><div class="post-grid" id="postGrid"></div></div></div>

  <!-- 6. AI 生图提示词 -->
  <div class="crd gen"><div class="ic">🖼️</div><div class="bd">
    <div class="lb">AI 生图提示词 <span style="color:var(--cyan);font-weight:400">（豆包 Seedream · 图生图模式）</span></div>
    <div class="prompt-box" id="promptBox"></div>
    <div class="prompt-actions">
      <button class="btn btn-copy" onclick="copyPrompt()">📋 复制提示词</button>
      <button class="btn btn-gen" onclick="goGenerate()">🖼️ 生图</button>
    </div>
  </div></div>

  <div class="toast" id="toast"></div>
</div>

let cur=0;

function render(){
  const tr=document.getElementById('track'),ds=document.getElementById('dotsEl');
  tr.innerHTML=plans.map((p,i)=>`<div class="slide" data-idx="${i}"><img src="${p.image}" alt="${p.name}" loading="${i===0?'eager':'lazy'}"></div>`).join('');
  ds.innerHTML=plans.map((_,i)=>`<span class="dot${i===0?' active':''}" data-idx="${i}"></span>`).join('');
  tr.addEventListener('scroll',()=>{
    const c=tr.scrollLeft+tr.clientWidth/2;let ai=0,md=Infinity;
    tr.querySelectorAll('.slide').forEach((s,i)=>{const d=Math.abs(c-(s.offsetLeft+s.clientWidth/2));if(d<md){md=d;ai=i;}});
    ds.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active',i===ai));
    update(ai);
  });
  ds.querySelectorAll('.dot').forEach(d=>d.addEventListener('click',()=>{const s=tr.querySelector(`[data-idx="${d.dataset.idx}"]`);if(s)s.scrollIntoView({behavior:'smooth',block:'nearest',inline:'start'});}));
  update(0);
}

function update(i){
  cur=i;const p=plans[i];
  document.getElementById('metaRow').innerHTML=`<span class="meta-badge shot">📐 ${p.shotSize}</span><span class="meta-badge angle">📷 ${p.angle}</span><span class="meta-badge dir" style="color:${p.accent}">${p.dir}</span>`;
  document.getElementById('shooterTags').innerHTML=p.shooter.map(a=>`<span class="tg ${a.c}">${a.i} ${a.t}</span>`).join('');
  document.getElementById('subjectTags').innerHTML=p.subTags.map(t=>`<span class="tg ${t.c}">${t.i} ${t.t}</span>`).join('');
  document.getElementById('subjectDesc').textContent=p.subDesc;
  document.getElementById('vibeText').textContent=p.vibe;
  document.getElementById('postGrid').innerHTML=p.post.map(x=>`<div class="post-item"><span class="p-cat ${x.cat}">${x.label}</span><span class="p-text">${x.text}</span></div>`).join('');
  document.getElementById('promptBox').textContent=p.prompt;
  document.getElementById('detBody').innerHTML=p.details.map(d=>`<div class="det-row"><span>${d.i}</span><span>${d.t}</span></div>`).join('');
  document.getElementById('detWrap').classList.remove('open');
}

function copyPrompt(){
  navigator.clipboard.writeText(plans[cur].prompt).then(()=>toast('✅ 已复制，打开豆包粘贴即可生图')).catch(()=>toast('⚠️ 复制失败，请手动长按选择文字'));
}
function goGenerate(){
  navigator.clipboard.writeText(plans[cur].prompt).then(()=>{
    toast('🛠️ 在线生图开发中，提示词已复制，可打开豆包粘贴生成');
  }).catch(()=>{
    toast('🛠️ 在线生图开发中，请手动复制提示词，打开豆包粘贴生成');
  });
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

render();
</script>
</body>
</html>
