<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>带拍 · 实时拍摄引导</title>
<style>
  :root {
    --bg: #0a0a0a; --card: #141414; --text: #e8e8e8;
    --dim: #8a8a8a; --dimmer: #5a5a5a;
    --green: #4ade80; --gold: #f59e0b;
    --purple: #a78bfa; --cyan: #22d3ee; --border: #262626;
    --radius: 14px;
    --danger: #ef4444;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", sans-serif;
    background: #000; color: var(--text); min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }

  .app {
    max-width: 480px; margin: 0 auto;
    display: flex; flex-direction: column;
    height: 100dvh; height: 100vh;
  }

  /* ── Viewfinder Area ── */
  .viewfinder-wrap {
    flex: 1; position: relative; overflow: hidden;
    background: #000; min-height: 0;
  }

  /* Video fills the viewfinder */
  #cameraVideo {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
  }

  /* Fallback: static plan image when camera unavailable */
  #fallbackImage {
    width: 100%; height: 100%; object-fit: cover;
    display: none;
  }

  /* ── Overlay Layer ── */
  .overlay {
    position: absolute; inset: 0;
    pointer-events: none;  /* touch passes through to video */
    z-index: 10;
  }

  /* Grid lines */
  .grid-v { position: absolute; top:0; bottom:0; width:1px; background: rgba(255,255,255,0.18); }
  .grid-v.l { left: 33.333%; } .grid-v.r { left: 66.666%; }
  .grid-h { position: absolute; left:0; right:0; height:1px; background: rgba(255,255,255,0.18); }
  .grid-h.t { top: 33.333%; } .grid-h.b { top: 66.666%; }

  /* Subject positioning circles */
  .subject-ring {
    position: absolute;
    border: 2.5px solid rgba(245,158,11,0.7);
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(245,158,11,0.25), inset 0 0 12px rgba(245,158,11,0.08);
  }
  .subject-label {
    position: absolute;
    padding: 3px 10px; border-radius: 6px;
    background: rgba(8,8,12,0.85);
    color: #f59e0b; font-size: 12px; font-weight: 600;
    white-space: nowrap;
  }

  /* Horizon reference */
  .horizon-line {
    position: absolute; left: 0; right: 0; height: 1.5px;
    background: rgba(255,255,255,0.25);
  }
  .horizon-line::before, .horizon-line::after {
    content: ''; position: absolute; top: -4px;
    width: 20px; height: 9px; border-left: 1.5px solid rgba(255,255,255,0.35);
  }
  .horizon-line::after { right:0; border-left: none; border-right: 1.5px solid rgba(255,255,255,0.35); }

  /* Camera status indicator */
  .cam-status {
    position: absolute; top: 12px; right: 12px; z-index: 20;
    display: flex; align-items: center; gap: 6px;
  }
  .cam-dot {
    width: 8px; height: 8px; border-radius: 50%;
    animation: pulse 2s infinite;
  }
  .cam-dot.live { background: var(--danger); }
  .cam-dot.off  { background: var(--dimmer); animation: none; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .cam-label { font-size: 10px; color: rgba(255,255,255,0.5); letter-spacing: 0.5px; }

  /* Capture button (center-bottom of viewfinder) */
  .capture-btn-wrap {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 20; pointer-events: all;
  }
  .capture-btn {
    width: 64px; height: 64px; border-radius: 50%;
    background: rgba(255,255,255,0.18); border: 3px solid #fff;
    cursor: pointer; transition: all 0.15s;
    -webkit-tap-highlight-color: transparent;
  }
  .capture-btn:active { background: rgba(255,255,255,0.4); transform: scale(0.92); }

  /* Flash for capture feedback */
  .flash {
    position: absolute; inset: 0; z-index: 30;
    background: #fff; opacity: 0; pointer-events: none;
    transition: opacity 0.08s;
  }
  .flash.fire { opacity: 1; }

  /* ── Permission / Fallback Banner ── */
  .perm-banner {
    position: absolute; inset: 0; z-index: 25;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.9);
    pointer-events: all; text-align: center; padding: 24px;
  }
  .perm-banner .perm-icon { font-size: 48px; margin-bottom: 12px; }
  .perm-banner .perm-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
  .perm-banner .perm-desc { font-size: 13px; color: var(--dim); line-height: 1.6; margin-bottom: 16px; }
  .perm-btn {
    padding: 12px 28px; border-radius: 12px; border: none;
    background: var(--gold); color: #000; font-size: 14px; font-weight: 700;
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  .perm-btn:active { opacity: 0.8; }
  .perm-hint { font-size: 11px; color: var(--dimmer); margin-top: 12px; }

  /* ── Info Cards Area (below viewfinder) ── */
  .cards-area {
    flex-shrink: 0; background: var(--bg);
    padding: 8px 12px 12px;
    max-height: 45vh; overflow-y: auto;
  }

  /* Plan tabs for switching */
  .plan-tabs {
    display: flex; gap: 6px; margin-bottom: 8px; overflow-x: auto;
    scrollbar-width: none; -ms-overflow-style: none;
  }
  .plan-tabs::-webkit-scrollbar { display: none; }
  .plan-tab {
    flex-shrink: 0; padding: 7px 14px; border-radius: 10px;
    font-size: 12px; font-weight: 600; white-space: nowrap;
    background: var(--card); color: var(--dim); border: 1px solid var(--border);
    cursor: pointer; -webkit-tap-highlight-color: transparent; transition: all 0.2s;
  }
  .plan-tab.active {
    background: rgba(245,158,11,0.10); border-color: var(--gold); color: var(--gold);
  }

  /* Compact action cards */
  .compact-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px 12px; margin-bottom: 4px;
    border-radius: 10px; font-size: 13px;
  }
  .compact-row.shooter { background: rgba(34,211,238,0.05); border: 1px solid rgba(34,211,238,0.08); }
  .compact-row.subject { background: rgba(74,222,128,0.04); border: 1px solid rgba(74,222,128,0.08); }
  .compact-row .row-em { font-size: 16px; flex-shrink: 0; }
  .compact-row .row-text { flex: 1; color: var(--dim); font-weight: 500; }
  .compact-tag {
    display: inline-flex; align-items: center; gap: 3px;
    padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }
  .compact-tag.move   { background: rgba(34,211,238,0.12); color: var(--cyan); }
  .compact-tag.height { background: rgba(167,139,250,0.12); color: var(--purple); }
  .compact-tag.gear   { background: rgba(138,138,138,0.12); color: var(--dim); }
  .compact-tag.pose   { background: rgba(74,222,128,0.10); color: var(--green); }

</style>
</head>
<body>
<div class="app">

  <!-- ====== VIEWFINDER ====== -->
  <div class="viewfinder-wrap" id="viewfinderWrap">
    <video id="cameraVideo" playsinline autoplay muted></video>
    <img id="fallbackImage" src="" alt="方案参考图">

    <!-- Overlay: grid + subjects + horizon -->
    <div class="overlay" id="overlay">
      <!-- Grid -->
      <div class="grid-v l"></div><div class="grid-v r"></div>
      <div class="grid-h t"></div><div class="grid-h b"></div>
      <!-- Horizon (hidden by default, shown for wide/full shots) -->
      <div class="horizon-line" id="horizonRef" style="display:none;top:50%;"></div>
      <!-- Subject rings injected by JS -->
      <div id="subjectRings"></div>
    </div>

    <!-- Camera status -->
    <div class="cam-status">
      <div class="cam-dot live" id="camDot"></div>
      <span class="cam-label" id="camLabel">LIVE</span>
    </div>

    <!-- Capture button -->
    <div class="capture-btn-wrap" id="captureBtnWrap">
      <button class="capture-btn" id="captureBtn" title="拍摄"></button>
    </div>

    <!-- Flash effect -->
    <div class="flash" id="flash"></div>

    <!-- Permission / fallback banner -->
    <div class="perm-banner" id="permBanner">
      <div class="perm-icon">📷</div>
      <div class="perm-title">打开相机以使用实时引导</div>
      <div class="perm-desc">取景框上叠加构图线和定位圈<br>你只需要把画面中的主体对齐标记</div>
      <button class="perm-btn" id="permBtn">开启相机</button>
      <div class="perm-hint">需要 HTTPS 或 localhost 环境</div>
    </div>
  </div>

  <!-- ====== INFO CARDS ====== -->
  <div class="cards-area" id="cardsArea">
    <!-- Plan tabs -->
    <div class="plan-tabs" id="planTabs"></div>

    <!-- Shooter actions -->
    <div class="compact-row shooter" id="shooterRow">
      <span class="row-em">📍</span>
      <span class="row-text" id="shooterText"></span>
    </div>

    <!-- Subject actions -->
    <div class="compact-row subject" id="subjectRow">
      <span class="row-em">🧍</span>
      <span class="row-text" id="subjectText"></span>
    </div>
  </div>

</div>

<script>
// ============================================================
// Plan Data (4 plans, same as before)
// ============================================================
const plans = [
  {
    id: 'plan1', name: '中景互动', accent: '#f59e0b',
    image: 'plan_v4_plan1.jpg',
    subjects: [
      { x: 27, y: 45, r: 8, label: '人物' },
      { x: 58, y: 72, r: 6, label: '宠物' },
    ],
    horizon: null,
    shooterTags: [
      { text:'靠近一步', icon:'→', cls:'move' },
      { text:'蹲下', icon:'🧎', cls:'height' },
      { text:'主摄', icon:'📷', cls:'gear' },
    ],
    subjectText: '侧身45° · 不看镜头 · 手自然垂放',
    subjectTags: [
      { text:'侧身45°', icon:'🧍', cls:'pose' },
      { text:'不看镜头', icon:'👀', cls:'pose' },
    ],
  },
  {
    id: 'plan2', name: '全景氛围', accent: '#22d3ee',
    image: 'plan_v4_plan2.jpg',
    subjects: [
      { x: 24, y: 54, r: 5, label: '人宠' },
    ],
    horizon: 52,
    shooterTags: [
      { text:'退后4步', icon:'←', cls:'move' },
      { text:'站立', icon:'🧍', cls:'height' },
      { text:'主摄', icon:'📷', cls:'gear' },
    ],
    subjectText: '自然站立 · 面朝河对岸 · 不需刻意摆拍',
    subjectTags: [
      { text:'自然站立', icon:'🧍', cls:'pose' },
      { text:'牵狗绳', icon:'🐕', cls:'pose' },
    ],
  },
  {
    id: 'plan3', name: '近景特写', accent: '#a78bfa',
    image: 'plan_v4_plan3.jpg',
    subjects: [
      { x: 30, y: 38, r: 11, label: '人物' },
      { x: 55, y: 66, r: 7, label: '狗' },
    ],
    horizon: null,
    shooterTags: [
      { text:'再靠近', icon:'→→', cls:'move' },
      { text:'蹲更低', icon:'🧎', cls:'height' },
      { text:'人像模式', icon:'📷', cls:'gear' },
    ],
    subjectText: '蹲下与狗平视 · 手摸狗头 · 嘴角轻笑',
    subjectTags: [
      { text:'蹲下平视', icon:'🧎', cls:'pose' },
      { text:'手摸狗头', icon:'✋', cls:'pose' },
    ],
  },
  {
    id: 'plan4', name: '侧面角度', accent: '#4ade80',
    image: 'plan_v4_plan4.jpg',
    subjects: [
      { x: 40, y: 48, r: 7, label: '人物' },
      { x: 67, y: 70, r: 5, label: '宠物' },
    ],
    horizon: 48,
    shooterTags: [
      { text:'左移3步', icon:'⬅', cls:'move' },
      { text:'右转90°', icon:'🔄', cls:'move' },
      { text:'主摄', icon:'📷', cls:'gear' },
    ],
    subjectText: '侧身站立 · 转头回看镜头 · 自然微笑',
    subjectTags: [
      { text:'侧身站立', icon:'🚶', cls:'pose' },
      { text:'转头回看', icon:'🔙', cls:'pose' },
    ],
  },
];

let currentPlan = 0;
let stream = null;

// ============================================================
// Camera
// ============================================================
async function startCamera() {
  const video = document.getElementById('cameraVideo');
  const permBanner = document.getElementById('permBanner');
  const fallbackImg = document.getElementById('fallbackImage');
  const camDot = document.getElementById('camDot');
  const camLabel = document.getElementById('camLabel');

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: 'environment',  // back camera
        width: { ideal: 1920 },
        height: { ideal: 1080 },
      },
      audio: false,
    });
    video.srcObject = stream;
    video.style.display = 'block';
    fallbackImg.style.display = 'none';
    permBanner.style.display = 'none';
    camDot.className = 'cam-dot live';
    camLabel.textContent = 'LIVE';
    document.getElementById('captureBtn').style.display = '';
  } catch (err) {
    console.warn('Camera unavailable:', err.message);
    // Fallback: show static plan image
    video.style.display = 'none';
    fallbackImg.style.display = 'block';
    fallbackImg.src = plans[currentPlan].image;
    camDot.className = 'cam-dot off';
    camLabel.textContent = 'OFF';
    permBanner.querySelector('.perm-icon').textContent = '⚠️';
    permBanner.querySelector('.perm-title').textContent = '相机不可用';
    permBanner.querySelector('.perm-desc').textContent =
      (err.name === 'NotAllowedError')
        ? '你拒绝了相机权限。\n请在浏览器设置中允许相机访问，或使用静态参考图模式。'
        : (err.name === 'NotFoundError')
          ? '未检测到摄像头。\n请确认设备有后置摄像头。'
          : `错误：${err.message}\n\n已切换到静态参考图模式。`;
    permBanner.querySelector('.perm-btn').textContent = '重试';
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  const video = document.getElementById('cameraVideo');
  video.srcObject = null;
  video.style.display = 'none';
  document.getElementById('camDot').className = 'cam-dot off';
  document.getElementById('camLabel').textContent = 'OFF';
}

// ============================================================
// Overlay: update subject rings for current plan
// ============================================================
function updateOverlay(idx) {
  const p = plans[idx];
  const container = document.getElementById('subjectRings');
  const horizonRef = document.getElementById('horizonRef');
  const overlay = document.getElementById('overlay');

  // Subject rings
  let html = '';
  p.subjects.forEach(s => {
    const size = s.r * 0.85; // % of overlay size
    html += `
      <div class="subject-ring" style="
        left:${s.x - size/2}%; top:${s.y - size/2}%;
        width:${size}%; height:${size * (16/9)}%;
      "></div>
      <div class="subject-label" style="
        left:${s.x + size/2 + 2}%; top:${s.y - 2}%;
      ">${s.label}</div>`;
  });
  container.innerHTML = html;

  // Horizon line (only for wide/full shots)
  if (p.horizon) {
    horizonRef.style.display = '';
    horizonRef.style.top = p.horizon + '%';
  } else {
    horizonRef.style.display = 'none';
  }
}

// ============================================================
// Capture
// ============================================================
function capture() {
  const video = document.getElementById('cameraVideo');
  const flash = document.getElementById('flash');

  if (!stream || video.style.display === 'none') {
    // Fallback: just flash to indicate "capture" intent
    flash.classList.add('fire');
    setTimeout(() => flash.classList.remove('fire'), 150);
    return;
  }

  // Create canvas from video frame
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');

  // Mirror if front camera (back camera = no mirror)
  ctx.drawImage(video, 0, 0);

  // Flash effect
  flash.classList.add('fire');
  setTimeout(() => flash.classList.remove('fire'), 150);

  // Trigger download
  canvas.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `daipai_${plans[currentPlan].name}_${Date.now()}.jpg`;
    a.click();
    URL.revokeObjectURL(url);
  }, 'image/jpeg', 0.92);
}

// ============================================================
// Cards area: update for current plan
// ============================================================
function updateCards(idx) {
  const p = plans[idx];

  // Tabs
  document.getElementById('planTabs').innerHTML = plans.map((pl, i) =>
    `<button class="plan-tab${i === idx ? ' active' : ''}" data-idx="${i}">${pl.name}</button>`
  ).join('');

  // Shooter row
  document.getElementById('shooterText').innerHTML = p.shooterTags.map(t =>
    `<span class="compact-tag ${t.cls}">${t.icon} ${t.text}</span>`
  ).join(' ');

  // Subject row
  document.getElementById('subjectText').innerHTML =
    p.subjectTags.map(t => `<span class="compact-tag ${t.cls}">${t.icon} ${t.text}</span>`).join(' ') +
    ` <span style="font-size:12px;color:var(--dimmer);">${p.subjectText}</span>`;
}

// ============================================================
// Switch plan
// ============================================================
function switchPlan(idx) {
  currentPlan = idx;
  updateOverlay(idx);
  updateCards(idx);

  // If camera is off, update fallback image
  const fallbackImg = document.getElementById('fallbackImage');
  if (fallbackImg.style.display !== 'none') {
    fallbackImg.src = plans[idx].image;
  }
}

// ============================================================
// Init
// ============================================================
document.getElementById('permBtn').addEventListener('click', startCamera);
document.getElementById('captureBtn').addEventListener('click', capture);

// Tab clicks
document.getElementById('planTabs').addEventListener('click', e => {
  const tab = e.target.closest('.plan-tab');
  if (tab) switchPlan(parseInt(tab.dataset.idx));
});

// Initial render
updateOverlay(0);
updateCards(0);

// Stop camera on page hide (save battery)
document.addEventListener('visibilitychange', () => {
  if (document.hidden) stopCamera();
});
</script>
</body>
</html>
