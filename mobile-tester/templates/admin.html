<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>带拍 · 管理面板</title>
<style>
:root {
  --bg: #0f0f0f; --card: #1a1a1a; --card2: #222;
  --text: #e5e5e5; --dim: #999; --dimmer: #666;
  --border: #2a2a2a; --green: #4ade80; --red: #ef4444;
  --purple: #a78bfa; --fire: #f59e0b; --radius: 14px; --radius-sm: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; padding: 16px; max-width: 640px; margin: 0 auto; }
h1 { font-size: 20px; margin-bottom: 4px; }
h2 { font-size: 15px; color: var(--dim); margin: 20px 0 10px; }
.subtitle { font-size: 12px; color: var(--dimmer); margin-bottom: 16px; }

/* Stats cards */
.stats-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 16px; }
.stat-card { background: var(--card); border-radius: var(--radius-sm); padding: 14px 12px; text-align: center; border: 1px solid var(--border); }
.stat-card .val { font-size: 24px; font-weight: 700; }
.stat-card .lbl { font-size: 11px; color: var(--dim); margin-top: 2px; }
.val.green { color: var(--green); }
.val.red { color: var(--red); }
.val.purple { color: var(--purple); }

/* Quota requests */
.req-card { background: var(--card); border-radius: var(--radius-sm); padding: 14px; margin-bottom: 8px; border: 1px solid var(--border); }
.req-card .req-row { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
.req-card .req-info { font-size: 13px; }
.req-card .req-info .ip { font-weight: 600; }
.req-card .req-info .meta { font-size: 11px; color: var(--dim); }
.req-card .req-actions { display: flex; gap: 6px; }
.req-card .req-actions button {
  padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none;
}
.btn-approve { background: var(--green); color: #000; }
.btn-approve:active { opacity: 0.8; }
.btn-reject { background: rgba(239,68,68,0.15); color: var(--red); border: 1px solid rgba(239,68,68,0.3); }
.btn-reject:active { opacity: 0.8; }

/* Empty state */
.empty { text-align: center; padding: 20px; color: var(--dimmer); font-size: 13px; }

/* Reason list */
.reason-list { list-style: none; }
.reason-list li { display: flex; justify-content: space-between; padding: 8px 12px; background: var(--card); border-radius: 8px; margin-bottom: 4px; font-size: 13px; border: 1px solid var(--border); }
.reason-list li .rc { color: var(--dim); font-size: 12px; }

/* Feedback table */
.fb-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.fb-table th { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); color: var(--dim); font-weight: 500; }
.fb-table td { padding: 8px 6px; border-bottom: 1px solid rgba(42,42,42,0.5); color: var(--text); }
.fb-table .rt-like { color: var(--green); }
.fb-table .rt-dislike { color: var(--red); }

/* Trend */
.trend-bar { display: flex; gap: 4px; align-items: flex-end; height: 80px; padding: 8px 0; }
.trend-day { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.trend-day .bar { width: 100%; border-radius: 4px 4px 0 0; background: var(--purple); min-height: 2px; transition: height 0.3s; }
.trend-day .day { font-size: 10px; color: var(--dim); }
.trend-day .cnt { font-size: 10px; color: var(--dimmer); }

/* Refresh */
.refresh-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
.refresh-bar .last { font-size: 11px; color: var(--dimmer); }
.refresh-bar button {
  padding: 6px 14px; border-radius: 8px; font-size: 12px; background: var(--card);
  border: 1px solid var(--border); color: var(--dim); cursor: pointer;
}

/* Status bar */
.status-bar { display: flex; gap: 12px; margin-bottom: 16px; font-size: 11px; color: var(--dim); flex-wrap: wrap; }
.status-bar span { padding: 3px 8px; background: var(--card2); border-radius: 6px; }
.status-bar .ok { color: var(--green); }
.status-bar .warn { color: var(--fire); }
</style>
</head>
<body>
<h1>🔑 带拍 · 管理面板</h1>
<div class="subtitle" id="lastUpdate">加载中...</div>

<div class="status-bar" id="statusBar"></div>

<!-- ⏳ 待审批申请 -->
<h2>⏳ 待审批申请</h2>
<div id="pendingRequests"><div class="empty">加载中...</div></div>

<!-- 📊 概览 -->
<h2>📊 反馈概览</h2>
<div class="stats-grid" id="statsGrid"></div>

<!-- 👎 原因分布 -->
<h2>👎 不满意原因</h2>
<ul class="reason-list" id="reasonList"></ul>

<!-- 📝 近期反馈 -->
<h2>📝 近期反馈</h2>
<div style="overflow-x:auto;">
<table class="fb-table">
<thead><tr><th>时间</th><th>场景</th><th>风格</th><th>方案</th><th>评价</th><th>原因</th></tr></thead>
<tbody id="recentFeedback"></tbody>
</table>
</div>

<!-- 📈 7天趋势 -->
<h2>📈 7天使用趋势</h2>
<div class="trend-bar" id="trendBar"></div>

<!-- 🧠 v3.6: AI API 调用监控 -->
<h2>🧠 AI API 调用监控</h2>
<div class="stats-grid" id="apiStatsGrid"></div>
<div class="trend-bar" id="apiTrendBar" style="height:50px"></div>
<div style="overflow-x:auto;margin-top:8px">
<table class="fb-table">
<thead><tr><th>时间</th><th>类型</th><th>Tokens</th><th>耗时</th><th>状态</th><th>Session</th></tr></thead>
<tbody id="apiCallLog"></tbody>
</table>
</div>

<!-- 🌐 v3.6: Web 搜索追踪 -->
<h2>🌐 Web 搜索追踪</h2>
<div class="stats-grid" id="searchStatsGrid"></div>
<div style="overflow-x:auto;margin-top:8px">
<table class="fb-table">
<thead><tr><th>时间</th><th>类型</th><th>查询</th><th>结果</th><th>质量</th><th>耗时</th></tr></thead>
<tbody id="searchLog"></tbody>
</table>
</div>

<!-- 🎨 v3.6: 风格技法发现面板 -->
<h2>🎨 风格技法发现</h2>
<div class="stats-grid" id="styleStatsGrid"></div>
<h2 style="font-size:13px;margin-top:12px">🏆 高频风格 Top</h2>
<div style="overflow-x:auto">
<table class="fb-table">
<thead><tr><th>风格名</th><th>来源</th><th>验证次数</th><th>首次发现</th></tr></thead>
<tbody id="topStyles"></tbody>
</table>
</div>
<h2 style="font-size:13px;margin-top:12px">🔧 高频技法 Top</h2>
<div style="overflow-x:auto">
<table class="fb-table">
<thead><tr><th>技法名</th><th>来源</th><th>验证次数</th><th>首次发现</th></tr></thead>
<tbody id="topTechniques"></tbody>
</table>
</div>

<script>
const REASON_LABELS = {
  'too_slow': '⏱️ 时间太久了',
  'style_not_match': '🎨 风格不喜欢',
  'plan_not_good': '📋 方案不喜欢',
  'guidance_unclear': '🤔 操作引导不清晰',
  'want_image_gen': '🖼️ 需要生图直接示意',
  'other': '💬 其他'
};

async function loadData() {
  try {
    const r = await fetch('/admin/stats');
    const d = await r.json();
    render(d);
    document.getElementById('lastUpdate').textContent = '更新于 ' + new Date().toLocaleTimeString();
  } catch(e) {
    document.getElementById('lastUpdate').textContent = '加载失败';
  }
}

function render(d) {
  // Status bar
  const sb = document.getElementById('statusBar');
  const limit = d.daily_limit || 10;
  sb.innerHTML = `
    <span>📋 限额: ${limit}次/天</span>
    <span>📊 总会话: ${d.db?.usage_sessions||0}</span>
    <span>💬 反馈: ${d.db?.feedback_entries||0}</span>
    <span>📅 今日: ${d.db?.today_analyses||0}次</span>
    <span>🟢 活跃: ${d.active_sessions||0}</span>
    <span class="${d.processing?'warn':'ok'}">${d.processing?'🔴 处理中':'🟢 空闲'}</span>
  `;

  // Pending requests
  const preq = document.getElementById('pendingRequests');
  const pending = d.pending_requests || [];
  if (pending.length === 0) {
    preq.innerHTML = '<div class="empty">✅ 没有待审批的申请</div>';
  } else {
    preq.innerHTML = pending.map(r => `
      <div class="req-card" id="req${r.id}">
        <div class="req-row">
          <div class="req-info">
            <span class="ip">${esc(r.ip_address)}</span>
            <div class="meta">已用 ${r.used_count||0}/${limit} 次 · ${(r.created_at||'').slice(0,16)}</div>
          </div>
          <div class="req-actions">
            <button class="btn-approve" onclick="approve(${r.id},'approve')">✅ 批准 +5次</button>
            <button class="btn-reject" onclick="approve(${r.id},'reject')">❌ 拒绝</button>
          </div>
        </div>
      </div>
    `).join('');
  }

  // Stats
  const f = d.feedback || {};
  const total = (f.total_likes||0) + (f.total_dislikes||0);
  const pct = total > 0 ? Math.round((f.total_likes||0) / total * 100) : 0;
  document.getElementById('statsGrid').innerHTML = `
    <div class="stat-card"><div class="val purple">${total}</div><div class="lbl">总反馈</div></div>
    <div class="stat-card"><div class="val green">${f.total_likes||0}</div><div class="lbl">👍 满意 (${pct}%)</div></div>
    <div class="stat-card"><div class="val red">${f.total_dislikes||0}</div><div class="lbl">👎 不满意 (${100-pct}%)</div></div>
  `;

  // Reasons
  const rl = document.getElementById('reasonList');
  const reasons = f.reasons || [];
  if (reasons.length === 0) {
    rl.innerHTML = '<li class="empty">暂无数据</li>';
  } else {
    const maxCount = reasons[0]?.count || 1;
    rl.innerHTML = reasons.map(r => {
      const pctBar = Math.round(r.count / maxCount * 100);
      return `<li>
        <span>${REASON_LABELS[r.reason]||r.reason}${r.reason==='other'?'':''}</span>
        <span class="rc">${r.count}次 <span style="color:var(--purple)">${'█'.repeat(Math.round(pctBar/10))}</span></span>
      </li>`;
    }).join('');
  }

  // Recent feedback
  const recent = f.recent || [];
  const rfb = document.getElementById('recentFeedback');
  if (recent.length === 0) {
    rfb.innerHTML = '<tr><td colspan="6" class="empty">暂无反馈数据</td></tr>';
  } else {
    rfb.innerHTML = recent.map(r => {
      const time = (r.updated_at||r.created_at||'').slice(0,16);
      const scene = (r.scene_type||r.us_scene_type||'-').slice(0,15);
      const style = (r.style||'-').slice(0,12);
      const plan = '#' + ((r.plan_index||0)+1);
      const rating = r.rating === 'like' ? '<span class="rt-like">👍</span>' : '<span class="rt-dislike">👎</span>';
      let reason = r.rating === 'dislike' ? (REASON_LABELS[r.reason]||r.reason||'') : '-';
      if (r.reason_text) reason += ' (' + r.reason_text.slice(0,20) + ')';
      return `<tr><td>${time}</td><td>${scene}</td><td>${style}</td><td>${plan}</td><td>${rating}</td><td>${reason}</td></tr>`;
    }).join('');
  }

  // Trend
  const trend = f.trend || [];
  const tb = document.getElementById('trendBar');
  if (trend.length === 0) {
    tb.innerHTML = '<span class="empty">暂无数据</span>';
  } else {
    const maxVal = Math.max(...trend.map(t=>t.total||0), 1);
    tb.innerHTML = trend.map(t => {
      const h = Math.max(2, Math.round((t.total||0) / maxVal * 70));
      const day = (t.usage_date||'').slice(5); // MM-DD
      return `<div class="trend-day"><div class="cnt">${t.total||0}</div><div class="bar" style="height:${h}px"></div><div class="day">${day}</div></div>`;
    }).join('');
  }

  // ── v3.6: 三块新监控 ──
  renderApiStats(d.api_stats);
  renderSearchStats(d.search_stats);
  renderStylePanel(d.style_panel);
}

// ── v3.6: AI API 调用监控渲染 ──
function renderApiStats(as) {
  if (!as || !as.total_calls) {
    document.getElementById('apiStatsGrid').innerHTML = '<div class="empty" style="grid-column:1/-1">暂无 API 调用数据</div>';
    document.getElementById('apiCallLog').innerHTML = '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
    return;
  }

  const todayMap = {};
  (as.today_calls||[]).forEach(c => { todayMap[c.call_type] = c; });
  const v = todayMap['vision'] || {};
  const d = todayMap['directions'] || {};
  const p = todayMap['plans'] || {};

  document.getElementById('apiStatsGrid').innerHTML = `
    <div class="stat-card"><div class="val purple">${as.total_calls||0}</div><div class="lbl">总调用次数</div></div>
    <div class="stat-card"><div class="val green">${(as.total_tokens||0).toLocaleString()}</div><div class="lbl">总 Tokens</div></div>
    <div class="stat-card"><div class="val" style="font-size:14px">👁${v.cnt||0} 🎬${d.cnt||0} 📋${p.cnt||0}</div><div class="lbl">今日 vision/directions/plans</div></div>
  `;

  // Token 趋势条
  const atb = document.getElementById('apiTrendBar');
  const aTrend = as.trend || [];
  if (aTrend.length === 0) {
    atb.innerHTML = '<span class="empty">暂无数据</span>';
  } else {
    const maxT = Math.max(...aTrend.map(t=>t.tokens||0), 1);
    atb.innerHTML = aTrend.map(t => {
      const h = Math.max(2, Math.round((t.tokens||0) / maxT * 40));
      const day = (t.day||'').slice(5);
      return `<div class="trend-day"><div class="cnt" style="font-size:9px">${((t.tokens||0)/1000).toFixed(0)}k</div><div class="bar" style="height:${h}px;background:var(--green)"></div><div class="day">${day}</div></div>`;
    }).join('');
  }

  // 最近调用明细
  const recent = as.recent || [];
  const alog = document.getElementById('apiCallLog');
  if (recent.length === 0) {
    alog.innerHTML = '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
  } else {
    const typeLabel = {vision:'👁 视觉识别', directions:'🎬 方向生成', plans:'📋 方案生成'};
    alog.innerHTML = recent.map(r => {
      const time = (r.created_at||'').slice(11,19);
      const icon = r.success ? '✅' : '❌';
      const sid = (r.session_id||'').slice(0,8);
      return `<tr>
        <td>${time}</td>
        <td>${typeLabel[r.call_type]||r.call_type}</td>
        <td>${r.total_tokens||0}</td>
        <td>${r.duration_ms||0}ms</td>
        <td>${icon}</td>
        <td style="font-size:10px;color:var(--dimmer)">${sid}</td>
      </tr>`;
    }).join('');
  }
}

// ── v3.6: Web 搜索追踪渲染 ──
function renderSearchStats(ss) {
  if (!ss || !ss.total_searches) {
    document.getElementById('searchStatsGrid').innerHTML = '<div class="empty" style="grid-column:1/-1">暂无搜索记录</div>';
    document.getElementById('searchLog').innerHTML = '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
    return;
  }

  const hitRate = ss.total_searches > 0 ? Math.round(ss.total_with_results / ss.total_searches * 100) : 0;
  document.getElementById('searchStatsGrid').innerHTML = `
    <div class="stat-card"><div class="val purple">${ss.total_searches||0}</div><div class="lbl">总搜索次数</div></div>
    <div class="stat-card"><div class="val green">${ss.total_with_results||0}</div><div class="lbl">有结果 (${hitRate}%)</div></div>
    <div class="stat-card"><div class="val red">${(ss.total_searches||0) - (ss.total_with_results||0)}</div><div class="lbl">无结果</div></div>
  `;

  // 最近搜索
  const recent = ss.recent || [];
  const slog = document.getElementById('searchLog');
  if (recent.length === 0) {
    slog.innerHTML = '<tr><td colspan="6" class="empty">暂无数据</td></tr>';
  } else {
    const typeLabel = {style:'🎨 风格', location:'📍 位置'};
    slog.innerHTML = recent.map(r => {
      const time = (r.created_at||'').slice(11,19);
      const query = (r.query_text||'').slice(0,50);
      const qualityIcon = r.result_count > 0 ? '🟢' : '🔴';
      const sources = (r.source_types||'').slice(0,30);
      return `<tr>
        <td>${time}</td>
        <td>${typeLabel[r.search_type]||r.search_type}</td>
        <td style="font-size:11px">${esc(query)}</td>
        <td>${r.result_count||0}条 ${sources ? '('+esc(sources)+')' : ''}</td>
        <td>${qualityIcon}</td>
        <td>${r.duration_ms||0}ms</td>
      </tr>`;
    }).join('');
  }
}

// ── v3.6: 风格技法发现面板 ──
function renderStylePanel(sp) {
  if (!sp) {
    document.getElementById('styleStatsGrid').innerHTML = '<div class="empty" style="grid-column:1/-1">暂无数据</div>';
    return;
  }

  const inferenceCnt = (sp.styles_by_source||[]).find(s=>s.source_type==='inference')?.cnt || 0;
  const communityCnt = (sp.styles_by_source||[]).find(s=>s.source_type==='community')?.cnt || 0;
  const tutorialCnt = (sp.styles_by_source||[]).find(s=>s.source_type==='tutorial')?.cnt || 0;

  document.getElementById('styleStatsGrid').innerHTML = `
    <div class="stat-card"><div class="val purple">${sp.total_styles||0}</div><div class="lbl">累计风格 ${sp.styles_today ? '(今日+'+sp.styles_today+')' : ''}</div></div>
    <div class="stat-card"><div class="val green">${sp.total_techniques||0}</div><div class="lbl">累计技法 ${sp.techniques_today ? '(今日+'+sp.techniques_today+')' : ''}</div></div>
    <div class="stat-card"><div class="val" style="font-size:13px">💡${inferenceCnt} 🌐${communityCnt} 📚${tutorialCnt}</div><div class="lbl">来源:推理/社区/教程</div></div>
  `;

  // Top 风格
  const ts = document.getElementById('topStyles');
  const topStyles = sp.top_styles || [];
  if (topStyles.length === 0) {
    ts.innerHTML = '<tr><td colspan="4" class="empty">暂无风格数据</td></tr>';
  } else {
    const srcLabel = {inference:'💡推理', community:'🌐社区', tutorial:'📚教程', portfolio:'🖼️作品集'};
    ts.innerHTML = topStyles.map(s => {
      const date = (s.created_at||'').slice(0,10);
      return `<tr>
        <td>${esc(s.name)}</td>
        <td>${srcLabel[s.source_type]||s.source_type||'?'}</td>
        <td style="color:var(--purple)">${s.verify_count||0}次</td>
        <td style="font-size:10px;color:var(--dimmer)">${date}</td>
      </tr>`;
    }).join('');
  }

  // Top 技法
  const tt = document.getElementById('topTechniques');
  const topTechs = sp.top_techniques || [];
  if (topTechs.length === 0) {
    tt.innerHTML = '<tr><td colspan="4" class="empty">暂无技法数据</td></tr>';
  } else {
    const srcLabel = {inference:'💡推理', community:'🌐社区', tutorial:'📚教程'};
    tt.innerHTML = topTechs.map(t => {
      const date = (t.created_at||'').slice(0,10);
      return `<tr>
        <td>${esc(t.name)}</td>
        <td>${srcLabel[t.source_type]||t.source_type||'?'}</td>
        <td style="color:var(--purple)">${t.verify_count||0}次</td>
        <td style="font-size:10px;color:var(--dimmer)">${date}</td>
      </tr>`;
    }).join('');
  }
}

async function approve(id, action) {
  const card = document.getElementById('req'+id);
  if (card) card.style.opacity = '0.5';
  try {
    const r = await fetch('/admin/approve', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({request_id:id, action:action})
    });
    const d = await r.json();
    if (d.success) {
      loadData(); // 重新加载
    } else {
      if (card) card.style.opacity = '1';
      alert(d.message || '操作失败');
    }
  } catch(e) {
    if (card) card.style.opacity = '1';
    alert('网络错误');
  }
}

function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// 自动刷新（每30秒）
loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
