<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>直出相机</title>
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --card2: #1a1a1a;
    --text: #e8e8e8;
    --dim: #8a8a8a;
    --dimmer: #555;
    --green: #4ade80;
    --fire: #f59e0b;
    --purple: #a78bfa;
    --cyan: #22d3ee;
    --border: #262626;
    --radius: 18px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Noto Sans SC", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100dvh;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }

  /* Header */
  .header { text-align: center; padding: 16px 0 8px; }
  .header h1 { font-size: 20px; font-weight: 700; letter-spacing: -0.3px;
    background: linear-gradient(135deg, #4ade80, #22d3ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .header p { font-size: 12px; color: var(--dim); margin-top: 2px; }

  /* Upload */
  .upload-zone {
    background: var(--card); border: 2px dashed var(--border);
    border-radius: var(--radius); padding: 36px 20px; text-align: center;
    cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
  }
  .upload-zone:active { background: var(--card2); border-color: var(--green); }
  .upload-zone .icon { font-size: 44px; display: block; margin-bottom: 10px; }
  .upload-zone .label { font-size: 15px; font-weight: 600; }
  .upload-zone .hint { font-size: 12px; color: var(--dim); margin-top: 4px; }
  .upload-zone input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
  .upload-zone.hidden { display: none; }

  /* Preview thumbnail */
  .preview-thumb { display: none; margin-bottom: 16px; border-radius: 12px; overflow: hidden; }
  .preview-thumb.show { display: block; }
  .preview-thumb img { width: 100%; display: block; max-height: 200px; object-fit: cover; }

  /* Loading */
  .loading { display: none; text-align: center; padding: 40px 0; }
  .loading.show { display: block; }
  .spinner {
    width: 36px; height: 36px; border: 3px solid var(--border);
    border-top-color: var(--green); border-radius: 50%;
    animation: spin 0.8s linear infinite; margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading .text { font-size: 14px; color: var(--dim); }
  .loading .hint { font-size: 12px; color: var(--dimmer); margin-top: 6px; }

  /* ── Step 1: Insight ── */
  .step { display: none; animation: fadeUp 0.3s ease; }
  .step.active { display: block; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

  .insight-block {
    background: var(--card); border-radius: var(--radius); padding: 24px 20px;
    border-left: 3px solid var(--cyan); margin-bottom: 20px;
  }
  .insight-block .tag {
    font-size: 10px; letter-spacing: 1.5px; color: var(--cyan);
    text-transform: uppercase; font-weight: 600; margin-bottom: 10px;
  }
  .insight-block .presence {
    font-size: 13px; color: var(--dim); line-height: 1.85; margin-bottom: 14px;
  }
  .insight-block .insight {
    font-size: 16px; font-weight: 600; line-height: 1.65; color: var(--text);
  }
  .btn-next {
    display: block; width: 100%; padding: 14px; background: var(--card);
    border: 1px solid var(--border); border-radius: 14px;
    color: var(--text); font-size: 15px; font-weight: 600; cursor: pointer;
    text-align: center; margin-top: 12px; transition: all 0.15s;
  }
  .btn-next:active { background: var(--card2); border-color: var(--green); }

  /* ── Step 2: Direction cards ── */
  .dir-card {
    background: var(--card); border-radius: var(--radius); padding: 20px;
    margin-bottom: 12px; cursor: pointer; transition: all 0.15s;
    border: 1px solid transparent;
  }
  .dir-card:active { transform: scale(0.985); border-color: var(--border); background: var(--card2); }
  .dir-card .badge {
    display: inline-block; font-size: 12px; font-weight: 700;
    padding: 4px 12px; border-radius: 20px; margin-bottom: 8px;
  }
  .badge-now { background: rgba(74,222,128,0.12); color: var(--green); }
  .badge-best { background: rgba(245,158,11,0.12); color: var(--fire); }
  .badge-creative { background: rgba(167,139,250,0.12); color: var(--purple); }
  .dir-card .style-name { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
  .dir-card .reason { font-size: 13px; color: var(--dim); line-height: 1.7; }
  .dir-card .source-tag { font-size: 10px; color: var(--dimmer); margin-top: 8px; }

  /* ── Step 3: Plans ── */
  .plans-header {
    display: flex; align-items: center; gap: 12px; margin-bottom: 16px;
    padding-bottom: 12px; border-bottom: 1px solid var(--border);
  }
  .plans-header .back {
    width: 36px; height: 36px; border-radius: 50%; background: var(--card);
    border: 1px solid var(--border); color: var(--text); font-size: 18px;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
    flex-shrink: 0;
  }
  .plans-header .info { flex: 1; }
  .plans-header .dir-label { font-size: 12px; color: var(--dim); }
  .plans-header .dir-style { font-size: 16px; font-weight: 700; }
  .plans-header .plan-count { font-size: 11px; color: var(--dimmer); }

  .plan-card {
    background: var(--card); border-radius: var(--radius); padding: 18px;
    margin-bottom: 10px; border: 1px solid var(--border);
  }
  .plan-card .plan-index {
    font-size: 10px; color: var(--dimmer); letter-spacing: 1px;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .plan-card .plan-name { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
  .plan-card .plan-action { font-size: 13px; color: var(--dim); line-height: 1.75; }
  .plan-card .plan-perspective {
    margin-top: 10px; padding: 8px 12px; background: rgba(74,222,128,0.06);
    border-radius: 10px; font-size: 12px; color: var(--green); line-height: 1.55;
  }

  /* Meta */
  .meta-bar {
    text-align: center; padding: 20px 0 8px; font-size: 11px; color: var(--dimmer);
    display: flex; justify-content: center; gap: 16px; flex-wrap: wrap;
  }
  .reshoot-btn {
    display: block; width: 100%; padding: 12px; margin-top: 16px;
    background: transparent; border: 1px solid var(--border); border-radius: 14px;
    color: var(--dim); font-size: 13px; cursor: pointer; text-align: center;
  }
  .reshoot-btn:active { border-color: var(--green); color: var(--text); }

  /* Error */
  .error-msg {
    background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.25);
    border-radius: 14px; padding: 16px; text-align: center;
    color: #ef4444; font-size: 13px; display: none; margin-top: 16px;
  }
  .error-msg.show { display: block; }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>📷 直出相机</h1>
    <p>拍照上传 → 看方案 → 拍出好照片</p>
  </div>

  <!-- Upload -->
  <div class="upload-zone" id="uploadZone">
    <span class="icon">📸</span>
    <div class="label">点击拍照或选照片</div>
    <div class="hint">HEIC / JPEG / PNG</div>
    <input type="file" id="fileInput" accept="image/*" capture="environment">
  </div>

  <!-- Preview -->
  <div class="preview-thumb" id="previewThumb">
    <img id="previewImg" src="" alt="预览">
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="text" id="loadingText">正在分析照片...</div>
    <div class="hint" id="loadingHint"></div>
  </div>

  <!-- Error -->
  <div class="error-msg" id="errorMsg"></div>

  <!-- Step 1: Insight -->
  <div class="step" id="stepInsight">
    <div class="insight-block" id="insightBlock"></div>
    <button class="btn-next" onclick="showDirections()">看看怎么拍 →</button>
  </div>

  <!-- Step 2: Directions -->
  <div class="step" id="stepDirs">
    <div id="dirCards"></div>
  </div>

  <!-- Step 3: Plans -->
  <div class="step" id="stepPlans">
    <div class="plans-header">
      <button class="back" onclick="showDirections()">←</button>
      <div class="info">
        <div class="dir-label" id="planDirLabel"></div>
        <div class="dir-style" id="planDirStyle"></div>
      </div>
      <div class="plan-count" id="planCount"></div>
    </div>
    <div id="planCards"></div>
  </div>

  <!-- Bottom bar -->
  <div class="meta-bar" id="metaBar"></div>
  <button class="reshoot-btn" id="reshootBtn" onclick="resetAll()">再拍一张</button>

</div>

<script>
const $ = s => document.querySelector(s);
let resultData = null;
let selectedDir = null;

const LOADING_TEXTS = [
  '正在识别场景光线...',
  '正在分析色彩和空间...',
  '正在匹配最佳风格...',
  '正在生成拍摄方案...',
  '马上好——最后润色...'
];
let loadingIdx = 0;
let loadingTimer = null;

// ── Upload ──
$('#fileInput').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = ev => {
    $('#previewImg').src = ev.target.result;
    $('#previewThumb').classList.add('show');
  };
  reader.readAsDataURL(file);

  startLoading();
  const fd = new FormData(); fd.append('photo', file);

  try {
    const resp = await fetch('/analyze', { method: 'POST', body: fd });
    const data = await resp.json();
    stopLoading();

    if (data.success) {
      resultData = data;
      $('#metaBar').innerHTML = `⏱ ${data.elapsed}s · 🪙 ${data.tokens} tokens`;
      showInsight();
    } else {
      showError(data.error || '分析失败');
    }
  } catch (err) {
    stopLoading();
    showError('网络错误：' + err.message);
  }
});

function startLoading() {
  $('#uploadZone').classList.add('hidden');
  hideAllSteps();
  $('#errorMsg').classList.remove('show');
  $('#loading').classList.add('show');
  loadingIdx = 0;
  $('#loadingText').textContent = LOADING_TEXTS[0];
  $('#loadingHint').textContent = '';
  loadingTimer = setInterval(() => {
    loadingIdx = (loadingIdx + 1) % LOADING_TEXTS.length;
    $('#loadingText').textContent = LOADING_TEXTS[loadingIdx];
  }, 3500);
}

function stopLoading() {
  clearInterval(loadingTimer);
  $('#loading').classList.remove('show');
}

function showError(msg) {
  $('#errorMsg').textContent = '❌ ' + msg;
  $('#errorMsg').classList.add('show');
  $('#uploadZone').classList.remove('hidden');
  $('#reshootBtn').style.display = 'block';
}

function hideAllSteps() {
  ['stepInsight', 'stepDirs', 'stepPlans'].forEach(id => {
    $('#' + id).classList.remove('active');
  });
}

// ── Step 1: Insight ──
function showInsight() {
  hideAllSteps();
  const r = resultData.result;
  if (!r || r.parse_error) { showError('结果解析失败'); return; }

  $('#insightBlock').innerHTML = `
    <div class="tag">场景洞察</div>
    <div class="presence">${esc(r.presence || '')}</div>
    <div class="insight">${esc(r.insight || '')}</div>
  `;
  $('#stepInsight').classList.add('active');
  $('#reshootBtn').style.display = 'block';
  $('#stepInsight').scrollIntoView({ behavior: 'smooth' });
}

// ── Step 2: Directions ──
function showDirections() {
  hideAllSteps();
  const dirs = (resultData.result.directions || []).filter(d => d && d.style);
  if (dirs.length === 0) { showError('未找到合适的方向'); return; }

  let html = '';
  dirs.forEach(d => {
    const cls = d.id === 'now' ? 'badge-now' : d.id === 'best' ? 'badge-best' : 'badge-creative';
    html += `
      <div class="dir-card" onclick="selectDirection('${d.id}')">
        <span class="badge ${cls}">${esc(d.emoji)} ${esc(d.label)}</span>
        <div class="style-name">${esc(d.style)}</div>
        <div class="reason">${esc(d.reason || '')}</div>
        ${d.source_note ? `<div class="source-tag">${esc(d.source_note)}</div>` : ''}
      </div>
    `;
  });
  $('#dirCards').innerHTML = html;
  $('#stepDirs').classList.add('active');
  $('#stepDirs').scrollIntoView({ behavior: 'smooth' });
}

// ── Step 3: Plans ──
function selectDirection(id) {
  const dirs = (resultData.result.directions || []).filter(d => d && d.style);
  selectedDir = dirs.find(d => d.id === id);
  if (!selectedDir) return;

  $('#planDirLabel').textContent = `${esc(selectedDir.emoji)} ${esc(selectedDir.label)}`;
  $('#planDirStyle').textContent = esc(selectedDir.style);
  const plans = selectedDir.plans || [];
  $('#planCount').textContent = `${plans.length} 套方案`;

  let html = '';
  plans.forEach((p, i) => {
    html += `
      <div class="plan-card">
        <div class="plan-index">方案 ${i + 1}</div>
        <div class="plan-name">${esc(p.name || '')}</div>
        <div class="plan-action">${esc(p.action || '')}</div>
        ${p.perspective ? `<div class="plan-perspective">🎯 换个思路：${esc(p.perspective)}</div>` : ''}
      </div>
    `;
  });
  $('#planCards').innerHTML = html;

  hideAllSteps();
  $('#stepPlans').classList.add('active');
  $('#stepPlans').scrollIntoView({ behavior: 'smooth' });
}

function resetAll() {
  hideAllSteps();
  resultData = null; selectedDir = null;
  $('#errorMsg').classList.remove('show');
  $('#previewThumb').classList.remove('show');
  $('#uploadZone').classList.remove('hidden');
  $('#metaBar').innerHTML = '';
  $('#reshootBtn').style.display = 'none';
  $('#fileInput').value = '';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function esc(s) {
  if (!s) return '';
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// Hide reshoot until first result
$('#reshootBtn').style.display = 'none';
</script>
</body>
</html>
