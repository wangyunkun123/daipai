<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>带拍 · 管理登录</title>
<style>
:root {
  --bg: #0f0f0f; --card: #1a1a1a;
  --text: #e5e5e5; --dim: #999;
  --border: #2a2a2a; --purple: #a78bfa; --red: #ef4444;
  --radius: 14px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  display: flex; justify-content: center; align-items: center;
  min-height: 100vh; padding: 20px;
}
.login-card {
  background: var(--card); border-radius: var(--radius);
  padding: 32px 28px; width: 100%; max-width: 360px;
  border: 1px solid var(--border); text-align: center;
}
h1 { font-size: 22px; margin-bottom: 4px; }
.sub { font-size: 13px; color: var(--dim); margin-bottom: 24px; }
input {
  width: 100%; padding: 12px 14px; border-radius: 10px;
  border: 1px solid var(--border); background: var(--bg);
  color: var(--text); font-size: 16px; outline: none;
  text-align: center; letter-spacing: 4px;
}
input:focus { border-color: var(--purple); }
button {
  width: 100%; margin-top: 14px; padding: 12px;
  border-radius: 10px; border: none; font-size: 16px;
  font-weight: 600; cursor: pointer;
  background: var(--purple); color: #fff;
}
button:active { opacity: 0.8; }
.error {
  color: var(--red); font-size: 13px; margin-top: 12px;
  min-height: 20px;
}
</style>
</head>
<body>
<div class="login-card">
  <h1>🔑 带拍 · 管理面板</h1>
  <p class="sub">输入密码继续</p>
  <form method="post">
    <input type="password" name="password" placeholder="管理员密码" autofocus>
    <button type="submit">登 录</button>
  </form>
  <p class="error">{{ error }}</p>
</div>
</body>
</html>
