<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>组图预览原型 — 带拍</title>
<style>
:root {
  --bg: #0a0a0a; --card: #141414; --card2: #1a1a1a; --text: #e8e8e8;
  --dim: #8a8a8a; --dimmer: #555; --green: #4ade80; --fire: #f59e0b;
  --purple: #a78bfa; --cyan: #22d3ee; --red: #ef4444; --border: #262626;
}
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

.header { padding: 14px 16px 10px; display: flex; align-items: center; gap: 8px; }
.header .back { font-size: 18px; color: var(--dim); cursor: pointer; text-decoration: none; }
.header h1 { font-size: 16px; font-weight: 600; flex: 1; }

.pill-bar { display: flex; gap: 6px; padding: 8px 16px 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.pill-bar::-webkit-scrollbar { display: none; }
.pill { flex-shrink: 0; padding: 6px 13px; border-radius: 16px; font-size: 11px; background: var(--card2); color: var(--dim); border: none; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
.pill.active { background: var(--fire); color: #000; font-weight: 600; }
.pill.contact-pill { font-weight: 700; background: rgba(245,158,11,0.15); color: var(--fire); }

.carousel { flex: 1; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; display: flex; scrollbar-width: none; }
.carousel::-webkit-scrollbar { display: none; }
.card { flex: 0 0 88%; scroll-snap-align: center; margin: 0 6%; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 20px; }

/* ── 组图预览卡片 ── */
.contact-card { text-align: center; }
.contact-card .ct-title { font-size: 16px; font-weight: 700; margin-bottom: 4px; }
.contact-card .ct-hint { font-size: 11px; color: var(--dimmer); margin-bottom: 14px; }

/* 网格：简约线框 */
.contact-grid { display: grid; gap: 3px; width: 100%; aspect-ratio: 3/4; margin-bottom: 10px; }
.contact-grid .gcell {
  position: relative;
  border: 1px solid #2a2a2a; border-radius: 4px;
  background: #0f0f0f;
  cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center; padding: 6px;
  transition: border-color 0.2s, background 0.2s;
}
.contact-grid .gcell:active { background: #1a1a1a; border-color: #444; }
.contact-grid .gcell .num { font-size: 10px; font-weight: 600; color: var(--dimmer); margin-bottom: 2px; }
.contact-grid .gcell .lbl { font-size: 10px; font-weight: 500; color: #aaa; line-height: 1.3; }
.contact-grid .gcell .mt { font-size: 8px; color: #555; margin-top: 2px; }

/* 提示词框 */
.v5-gen { border-top: 1px solid rgba(34,211,238,0.10); padding: 10px 12px; text-align: left; }
.v5-lb { font-size: 11px; color: var(--dimmer); letter-spacing: 0.3px; margin-bottom: 6px; }
.v5-pt { font-size: 11px; color: var(--dim); line-height: 1.6; max-height: 120px; overflow-y: auto; word-break: break-all; background: var(--card2); border-radius: 6px; padding: 10px; margin-bottom: 8px; }
.v5-pact { display: flex; gap: 8px; }
.v5-btn { padding: 8px 12px; border-radius: 8px; border: none; font-size: 12px; font-weight: 700; cursor: pointer; -webkit-tap-highlight-color: transparent; transition: all 0.15s; display: inline-flex; align-items: center; gap: 4px; min-height: 40px; white-space: nowrap; }
.v5-btn:active { transform: scale(0.96); }
.v5-btn.copy { background: rgba(138,138,138,0.15); color: var(--dim); flex:1; justify-content:center; }
.v5-btn.gen  { background: rgba(34,211,238,0.08); color: var(--cyan); opacity: 0.7; flex:1; justify-content:center; }

/* ── 方案卡片：保持现有 v3.7 样式 ── */
.v5-post-item { margin-bottom: 11px; }
.v5-pcat { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 4px; margin-right: 6px; letter-spacing: 0.5px; vertical-align: middle; }
.v5-pcat.comp { background: rgba(245,158,11,0.12); color: var(--fire); }
.v5-dhead { font-size: 13px; font-weight: 700; margin-bottom: 4px; color: var(--text); }
.v5-post-text { font-size: 13px; color: #bbb; line-height: 1.7; }
.v5-label { font-size: 12px; font-weight: 700; letter-spacing: 0.5px; color: var(--dim); margin-bottom: 4px; text-transform: uppercase; }
.v5-result { background: var(--card2); border-radius: 8px; padding: 10px 12px; margin-top: 6px; font-size: 13px; color: #bbb; line-height: 1.6; }
.why-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }

.toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.9); color: #fff; padding: 10px 22px; border-radius: 20px; font-size: 13px; font-weight: 600; opacity: 0; transition: opacity 0.25s; pointer-events: none; z-index: 9999; }
.toast.show { opacity: 1; }
</style>
</head>

/* 把 why 文本转成术语标签 */
function parseWhyTags(txt) {
  const TERMS = [
    {re:/三分法|九宫格|黄金分割/,cat:'comp'},{re:/引导线|对角线|S型|汇聚线/,cat:'comp'},
    {re:/框架构图|框中框|天然画框/,cat:'comp'},{re:/负空间|留白/,cat:'comp'},
    {re:/侧光|逆光|顺光|顶光|漫射光|边缘光|轮廓光/,cat:'light'},
    {re:/冷暖对比|互补色|邻近色|单色|色彩呼应/,cat:'color'},
    {re:/主体分离|景深|虚实|背景虚化|前景虚化/,cat:'dof'},
    {re:/前景层次|空间深度|纵深感/,cat:'space'},
    {re:/决定性瞬间|动态捕捉|静态|抓拍/,cat:'time'},
    {re:/明暗对比|影调|高调|低调/,cat:'tone'},
  ];
  const cats = {comp:'构图',light:'光线',color:'色彩',dof:'景深',space:'空间',time:'时机',tone:'影调'};
  const found = [];
  TERMS.forEach(t => { if (t.re.test(txt)) found.push(`<span class="v5-pcat comp">${cats[t.cat]}</span>`); });
  return found.length ? found.join(' ') : '';
}

function renderPlanCard(p, i) {
  const whyTagsHtml = parseWhyTags(p.why);
  let c = '';
  // 方案名
  c += `<div style="font-size:17px;font-weight:700;margin-bottom:4px">${p.name}</div>`;
  c += `<div style="font-size:11px;color:var(--dimmer);margin-bottom:14px">${p.size} · ${p.angle}</div>`;
  // 拍摄对象
  c += `<div class="v5-label">拍摄对象</div>`;
  c += `<div class="v5-post-text">${p.subject}</div>`;
  // 摄影师
  c += `<div class="v5-label" style="margin-top:14px">摄影师</div>`;
  c += `<div class="v5-post-item"><span class="v5-pcat comp">位置</span><span class="v5-post-text">${p.shooter}</span></div>`;
  c += `<div class="v5-post-item"><span class="v5-pcat comp">设置</span><span class="v5-post-text">${p.gear}</span></div>`;
  // 现场增色
  c += `<div class="v5-label" style="margin-top:14px">现场增色</div>`;
  c += `<div class="v5-post-text">${p.enhance}</div>`;
  // 场景观察
  c += `<div class="v5-label" style="margin-top:14px">场景观察</div>`;
  c += `<div class="v5-result">${p.result}</div>`;
  if (whyTagsHtml) c += `<div class="why-tags">${whyTagsHtml}</div>`;
  // 生图提示词
  c += `<div class="v5-gen" style="margin-top:16px">`;
  c += `<div class="v5-lb">🖼️ AI 生图提示词 <span style="color:var(--cyan);font-weight:400">（豆包 · 图生图模式）</span></div>`;
  c += `<div class="v5-pt" id="pt${i}">${p.img_gen_prompt}</div>`;
  c += `<div class="v5-pact"><button class="v5-btn copy" onclick="copyPlanPrompt(${i})">📋 复制提示词</button><button class="v5-btn gen" onclick="genPlan(${i})">🖼️ 生图</button></div>`;
  c += `</div>`;
  return c;
}

  for (let i=0;i<3;i++) {
    const p = PLANS[i];
    html += `<div class="gcell" onclick="scrollToCard(${i+1})"><span class="num">${i+1}</span><span class="lbl">${p.name}</span><span class="mt">${p.size} · ${p.angle}</span></div>`;
  }
  html += `<div class="gcell" style="grid-column:span 3" onclick="scrollToCard(4)"><span class="num">4</span><span class="lbl">${PLANS[3].name}</span><span class="mt">${PLANS[3].size} · ${PLANS[3].angle}</span></div>`;
  for (let i=4;i<7;i++) {
    const p = PLANS[i];
    html += `<div class="gcell" onclick="scrollToCard(${i+1})"><span class="num">${i+1}</span><span class="lbl">${p.name}</span><span class="mt">${p.size} · ${p.angle}</span></div>`;
  }
  html += '</div>';

  // 组图提示词
  html += '<div class="v5-gen">';
  html += '<div class="v5-lb">🖼️ 组图生成提示词 <span style="color:var(--cyan);font-weight:400">（豆包 · 图生图模式）</span></div>';
  html += `<div class="v5-pt" id="contactPrompt">${CONTACT_PROMPT}</div>`;
  html += '<div class="v5-pact"><button class="v5-btn copy" onclick="copyContactPrompt()">📋 复制提示词</button><button class="v5-btn gen" onclick="genContact()">🖼️ 生成组图</button></div>';
  html += '</div>';
  html += '</div>';

  // Cards 1-7: 方案详情（与 index.html 同款结构）
  PLANS.forEach((p,i) => {
    html += `<div class="card plan-card" id="card${i+1}">${renderPlanCard(p,i)}</div>`;
  });

  carouselEl.innerHTML = html;
}

function scrollToCard(idx) {
  const card = document.getElementById('card'+idx);
  if (!card) return;
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function onCarouselScroll() {
  const cards = carouselEl.querySelectorAll('.card');
  if (!cards.length) return;
  const cx = carouselEl.getBoundingClientRect().left + carouselEl.offsetWidth / 2;
  let best = 0, bestDist = Infinity;
  cards.forEach((c,i) => {
    const rect = c.getBoundingClientRect();
    const dist = Math.abs(rect.left + rect.width/2 - cx);
    if (dist < bestDist) { bestDist = dist; best = i; }
  });
  if (best !== activeIdx) { activeIdx = best; updatePills(); }
}

function updatePills() {
  pillBarEl.querySelectorAll('.pill').forEach((p,i) => p.classList.toggle('active', i===activeIdx));
  const ap = pillBarEl.querySelectorAll('.pill')[activeIdx];
  if (ap) ap.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function copyContactPrompt() { navigator.clipboard.writeText(CONTACT_PROMPT).then(() => showToast('✅ 组图提示词已复制，打开豆包粘贴即可生图')); }
function genContact() { navigator.clipboard.writeText(CONTACT_PROMPT).then(() => showToast('🛠️ 在线生图开发中，提示词已复制，可打开豆包粘贴生成')); }
function copyPlanPrompt(i) { navigator.clipboard.writeText(PLANS[i].img_gen_prompt).then(() => showToast('✅ 提示词已复制，打开豆包粘贴即可生图')); }
function genPlan(i) { navigator.clipboard.writeText(PLANS[i].img_gen_prompt).then(() => showToast('🛠️ 在线生图开发中，提示词已复制，可打开豆包粘贴生成')); }
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show'); t.style.opacity = '1';
  setTimeout(() => { t.style.opacity = '0'; }, 2500);
}

buildAll();
</script>
</body>
</html>
